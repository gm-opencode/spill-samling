      var s = '';
      for (var i = 0; i < 3; i++) s += INIT_CH.charAt(this.letters[i]);
      return s;
    },
    update: function () {
      if (this.doneF >= 0) {
        if (this.f - this.doneF > 70) go('title', { phase: 'scores', highlight: this.saved }, 'fade');
        return;
      }
      var m = Input.menu(), n = INIT_CH.length;
      if (m.up) { this.letters[this.pos] = (this.letters[this.pos] + 1) % n; A.sfx('menu_move'); }
      if (m.down) { this.letters[this.pos] = (this.letters[this.pos] + n - 1) % n; A.sfx('menu_move'); }
      if ((m.right || m.confirm) && this.f > 10) {
        if (this.pos < 2) { this.pos++; A.sfx('menu_select'); } else { this.finish(); return; }
      }
      if ((m.left || m.back) && this.pos > 0) { this.pos--; A.sfx('menu_back'); }
      if (--this.time <= 0) this.finish();
    },
    finish: function () {
      this.saved = insertHi(this.name(), this.score, this.hero);
      this.doneF = this.f;
      A.sfx('coin'); flash('#ffffff', 10);
    },
    draw: function (ctx) {
      bg('select', ctx);
      scrim(ctx, 0.65);
      var t = SF.time;
      glow(ctx, W / 2, 16, 130, 16, '#ff9a3a', 0.3 + 0.15 * Math.sin(t * 4));
      T(ctx, 'NEW HIGH SCORE!', W / 2, 6, { scale: 2, align: 'center', gradient: GOLDMETAL, outline: OUT });
      var rank = this.saved >= 0 ? this.saved : rankOf(this.score);
      T(ctx, 'SCORE ' + pad(this.score, 7) + '   RANK ' + (rank + 1), W / 2, 26, { align: 'center', color: '#ffffff' });
      T(ctx, 'ENTER YOUR INITIALS', W / 2, 38, { align: 'center', color: '#7fd8ff' });
      uiPanel(ctx, W - 64, 3, 58, 13, { edge: '#ff6a6a', sk: 4 });
      T(ctx, 'TIME ' + pad(Math.ceil(Math.max(0, this.time) / 60), 2), W - 10, 6, { align: 'right', color: '#ff9a9a' });
      for (var i = 0; i < 3; i++) {
        var x = W / 2 - 40 + i * 40, on = i === this.pos && this.doneF < 0;
        if (on) glow(ctx, x, 76, 30, 30, '#ffb43a', 0.35 * pulse(6, 0.4));
        uiPanel(ctx, x - 16, 54, 32, 44, { alpha: 0.9, edge: on ? COL.gold : '#46508a', sk: 4, sweep: on, top: on ? 'rgba(70,50,20,0.9)' : undefined });
        var la = on ? 0.6 + 0.4 * pulse(8, 0) : 1;
        ctx.save(); ctx.globalAlpha *= la;
        T(ctx, INIT_CH.charAt(this.letters[i]), x, 59, { scale: 5, align: 'center', gradient: on ? GOLDMETAL : CHROME, outline: OUT });
        ctx.restore();
        if (on) {
          var bob = Math.sin(SF.time * 6) * 1.2;
          ctx.save(); ctx.translate(x, 0); ctx.fillStyle = '#ffd23a';
          ctx.beginPath(); ctx.moveTo(-4, 50 - bob); ctx.lineTo(4, 50 - bob); ctx.lineTo(0, 45.5 - bob); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(-4, 102 + bob); ctx.lineTo(4, 102 + bob); ctx.lineTo(0, 106.5 + bob); ctx.closePath(); ctx.fill();
          ctx.restore();
          glow(ctx, x, 48, 8, 5, '#ffd23a', 0.5); glow(ctx, x, 104, 8, 5, '#ffd23a', 0.5);
        }
      }
      if (this.hero) drawPortrait(ctx, this.hero, 30, 52, 46, 46, { mood: 'win', frame: '#ffd23a', sk: 5 });
      var list = hiscores.slice();
      if (this.saved < 0) {
        list.splice(rank, 0, { name: this.name(), score: this.score, hero: this.hero });
        list.length = Math.min(list.length, HI_MAX);
      }
      uiPanel(ctx, 64, 110, 256, 108, { alpha: 0.9, edge: COL.gold });
      hiTable(ctx, W / 2, 114, rank, list);
    }
  };

  // ===========================================================================================================
  // 14. Boot, canvas fitting, main loop
  // ===========================================================================================================
  // ---- per-scene post-processing strength (bloom / vignette / grade) -------------------------------------------
  (function () {
    var P = function (b, v, g) { return { bloom: b, vig: v, grade: g }; };
    SCN.splash.post = P(0.6, 0.85, 0.5); SCN.title.post = P(0.45, 0.8, 0.55); SCN.demo.post = P(0.32, 0.7, 0.5);
    SCN.menu.post = P(0.45, 0.8, 0.5); SCN.options.post = P(0.35, 0.8, 0.45); SCN.howto.post = P(0.3, 0.75, 0.45);
    SCN.select.post = P(0.42, 0.8, 0.5); SCN.stage.post = P(0.38, 0.75, 0.5); SCN.map.post = P(0.4, 0.75, 0.5);
    SCN.vs.post = P(0.55, 0.85, 0.55); SCN.fight.post = P(0.32, 0.7, 0.5); SCN.win.post = P(0.5, 0.8, 0.55);
    SCN.cont.post = P(0.5, 0.9, 0.5); SCN.gameover.post = P(0.5, 0.9, 0.5); SCN.result.post = P(0.5, 0.8, 0.55);
    SCN.ceremony.post = P(0.4, 0.75, 0.5); SCN.credits.post = P(0.55, 0.85, 0.45); SCN.initials.post = P(0.45, 0.8, 0.5);
  })();
  var canvas = null, ctx = null, lastT = 0, acc = 0;
  var STEP_MS = 1000 / 60, MAX_STEPS = 5;

  // ---- resolution: RES = clamp(fit * devicePixelRatio, 2, quality cap), quantised to 1/8 ----------------------
  var curRes = 0, wantRes = 0, wantAt = 0;
  function computeFit() {
    var dpr = window.devicePixelRatio || 1;
    var iw = window.innerWidth || W, ih = window.innerHeight || H;
    var css = Math.min(iw / W, ih / H);
    if (!(css > 0) || !isFinite(css)) css = 1;
    var r = clamp(css * dpr, 2, quality().cap);
    return { css: css, res: Math.round(r * 8) / 8 };
  }
  function setRes(r) {
    curRes = r; wantRes = 0;
    try { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); } catch (e) { logOnce('canvas size', e); }
    SF.RES = r;
    SF.resVersion = (SF.resVersion || 0) + 1;
    try { GX.clearCaches(); } catch (e) { logOnce('clearCaches', e); }
    Text.clearCache(); myCaches.clear();
    if (ctx) { ctx._res = r; ctx.imageSmoothingEnabled = true; GX.reset(ctx); }
    perf.warm = 2; perf.bad = 0;
  }
  function fit(immediate) {
    if (!canvas) return;
    var m = computeFit();
    if (canvas.style) {
      canvas.style.width = Math.floor(W * m.css) + 'px';
      canvas.style.height = Math.floor(H * m.css) + 'px';
      canvas.style.imageRendering = 'auto';
    }
    if (m.res !== curRes) {
      if (immediate === true || !curRes) setRes(m.res);
      else { wantRes = m.res; wantAt = nowMs(); }
    } else wantRes = 0;
  }
  function applyGraphics() { if (canvas) fit(true); }

  // ---- frame-time monitor: auto-drop GRAPHICS one level if the average work stays > 14 ms -------------------
  function monitor(ms) {
    perf.sum += ms; perf.n++;
    if (perf.n < 120) return;
    perf.avg = perf.sum / perf.n; perf.postAvg = perf.post / perf.n;
    perf.sum = 0; perf.post = 0; perf.n = 0;
    if (perf.warm > 0) { perf.warm--; return; }
    if (perf.avg > 14) {
      if (++perf.bad >= 3) {
        perf.bad = 0;
        if (opts.graphics < 2) {
          opts.graphics++; perf.drops++;
          saveOptions(); applyGraphics();
          toast('GRAPHICS: ' + quality().name + ' (AUTO)');
        }
      }
    } else perf.bad = 0;
  }

  function tick() {
    SF.time += 1 / SF.FPS;
    SF.frame++;
    Input.update();
    if (audioDirty) { audioDirty = false; applyAudioOptions(); if (musicWanted) A.call('music', musicWanted); }
    if (Input.pressed('KeyM')) {
      var muted = A.call('toggleMute');
      if (typeof muted !== 'boolean') muted = !localMuted;
      localMuted = muted;
      toast(muted ? 'SOUND OFF' : 'SOUND ON');
    }
    if (!cur) switchTo('splash', {});
    if (trans) {
      trans.f++;
      if (trans.phase === 'out') {
        if (trans.f >= trans.dur) {
          switchTo(trans.name, trans.data);
          trans.phase = 'in'; trans.f = 0; trans.dur = trans.kind === 'flash' ? 22 : 16;
        }
      } else if (trans.f >= trans.dur) trans = null;
    }
    if (cur && !(trans && trans.phase === 'out')) {
      cur.f++;
      try { cur.update(); sceneErr = 0; }
      catch (e) {
        failed('update ' + curName, e);
        if (++sceneErr > 90) { sceneErr = 0; trans = null; switchTo(curName === 'title' ? 'splash' : 'title', {}); }
      }
    }
    if (flashT > 0) flashT--;
    if (toastT > 0) toastT--;
  }

  function resetCtx(c) {
    GX.reset(c);
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
    c.imageSmoothingEnabled = true;
  }
  function drawToast(ctx) {
    var tw = Text.width(toastMsg, 1), a = clamp(toastT / 12, 0, 1) * clamp((100 - toastT) / 8, 0, 1);
    var x = W - tw - 22 + (1 - ease(clamp((100 - toastT) / 10, 0, 1))) * 40;
    ctx.save(); ctx.globalAlpha = a;
    uiPanel(ctx, x, 200, tw + 18, 15, { alpha: 0.95, edge: COL.gold, sk: 5 });
    T(ctx, toastMsg, x + 10, 204, { color: '#ffd23a' });
    ctx.restore();
  }
  function render() {
    if (!ctx) return;
    if (wantRes && nowMs() - wantAt > 180) setRes(wantRes);
    resetCtx(ctx);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if (cur) {
      try { cur.draw(ctx); }
      catch (e) { failed('draw ' + curName, e); resetCtx(ctx); placeholderBG(ctx, 'error', SF.time); }
    }
    resetCtx(ctx);
    if (flashT > 0) {
      var fa = clamp(flashT / flashMax, 0, 1);
      ctx.globalAlpha = fa * 0.75; R(ctx, 0, 0, W, H, flashCol); ctx.globalAlpha = 1;
    }
    if (trans) drawTransition(ctx, trans);
    resetCtx(ctx);
    postProcess(ctx);
    if (toastT > 0) drawToast(ctx);
    if (opts.retro) retroFilter(ctx);
    resetCtx(ctx);
  }

  function frame(ts) {
    window.requestAnimationFrame(frame);
    if (typeof ts !== 'number') ts = nowMs();
    if (!lastT) lastT = ts;
    var dt = ts - lastT;
    lastT = ts;
    if (!(dt >= 0)) dt = 0;
    if (dt > 250) dt = 250;
    acc += dt;
    var n = 0, t0 = nowMs();
    try {
      while (acc >= STEP_MS - 0.3 && n < MAX_STEPS) { tick(); acc -= STEP_MS; n++; }
      if (n >= MAX_STEPS) acc = 0;           // too far behind: drop the backlog instead of spiralling
      if (n > 0) { render(); monitor(nowMs() - t0); }
    } catch (e) { logOnce('frame', e); }
  }

  Core.boot = function () {
    if (Core._booted) return;
    Core._booted = true;
    loadOptions();
    try {
      canvas = document.getElementById('game');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.id = 'game';
        if (document.body) document.body.appendChild(canvas);
      }
      ctx = canvas.getContext('2d');
      fit(true);
      if (ctx) { ctx.imageSmoothingEnabled = true; GX.reset(ctx); }
    } catch (e) { logOnce('canvas', e); ctx = null; }
    loadHi();
    A.call('init');
    applyAudioOptions();
    Input._attach();
    window.addEventListener('resize', fit, false);
    window.addEventListener('orientationchange', fit, false);
    window.addEventListener('blur', function () { if (curName === 'fight') blurPause = true; }, false);
    try {
      document.addEventListener('visibilitychange', function () {
        lastT = 0; acc = 0; perf.warm = Math.max(perf.warm, 1); perf.n = 0; perf.sum = 0; perf.post = 0;
        if (document.hidden && curName === 'fight') blurPause = true;
      }, false);
    } catch (e) { /* ignore */ }
    switchTo('splash', {});
    lastT = 0;
    try { window.requestAnimationFrame(frame); } catch (e) { logOnce('raf', e); }
  };
  // One fixed 1/60 s simulation tick + draw (used by the main loop and by headless tests).
  Core.step = function () { tick(); render(); };
  Core.sceneName = function () { return curName; };
  // Extra helpers (debugging, tests, other modules may use them optionally)
  Core.go = function (name, data, kind) { go(name, data || {}, kind || 'cut'); };
  Core.state = function () { return G; };
  Core.options = function () { return opts; };
  Core.hiscores = function () { return hiscores; };
  Core.flash = flash;
  Core.drawFighter = drawFighter;
  Core.drawPortrait = drawPortrait;
  Core.drawMedal = drawMedal;
  Core.STAGE_IDS = stageIds;
  Core.setQuality = function (q) { opts.graphics = clamp(q | 0, 0, 2); saveOptions(); applyGraphics(); };
  // Rendering stats: averaged frame work (tick + render, ms), post-processing share, current RES / quality.
  Core.perf = function () {
    return { frameMs: perf.avg, postMs: perf.postAvg, res: SF.RES, backing: canvas ? [canvas.width, canvas.height] : null,
      quality: quality().name, autoDrops: perf.drops };
  };
  // GPU-synchronised post-processing benchmark (forces a pixel readback before/after each run).
  Core.benchPost = function (n) {
    if (!ctx) return null;
    n = n || 60;
    // sync through a tiny probe canvas (reading the main canvas back would demote it to software rendering)
    var probe = GX.canvas(1, 1, 1);
    var sync = function () { try { probe.ctx.drawImage(canvas, 0, 0, 1, 1); probe.ctx.getImageData(0, 0, 1, 1); } catch (e) { /* ignore */ } };
    var q = quality(), s = (cur && cur.post) || POST_DEFAULT;
    var stages = [['sync', function () {}], ['bloom', function () { bloom(ctx, s.bloom == null ? POST_DEFAULT.bloom : s.bloom, q.levels); }],
      ['gradeVig', function () { gradeVignette(ctx, POST_DEFAULT.grade, POST_DEFAULT.vig); }],
      ['grain', function () { grain(ctx, POST_DEFAULT.grain); }], ['all', function () { postProcess(ctx); }]];
    var out = { res: SF.RES, quality: q.name }, scene = 0;
    for (var k = 0; k < stages.length; k++) {
      var tot = 0;
      for (var i = 0; i < n; i++) {
        var t0 = nowMs(); resetCtx(ctx); if (cur) cur.draw(ctx); resetCtx(ctx); sync();
        var t1 = nowMs(); stages[k][1](); resetCtx(ctx); sync();
        scene += t1 - t0; tot += nowMs() - t1;
      }
      out[stages[k][0] + 'Ms'] = +(tot / n).toFixed(3);
    }
    out.sceneMs = +(scene / n / stages.length).toFixed(3);
    return out;
  };
})(window.SF);

window.addEventListener('load', function () {
  if (window.SF && window.SF.Core && !window.SF.Core._booted) window.SF.Core.boot();
});


</script>
</body>
