<script>
/* ===== 00_base.js ===== */
/* SAP FIGHTER — 00_base.js (owned by orchestrator)
 * Shared namespace, constants, registries and tiny utilities.
 * Every other module may rely on everything defined here at load time.
 */
window.SF = window.SF || {};
(function (SF) {
  'use strict';

  // ---- Screen / world constants -------------------------------------------
  SF.W = 384;            // native render width (pixels)
  SF.H = 224;            // native render height
  SF.GROUND_Y = 200;     // screen-space y of the fighters' feet / floor line
  SF.STAGE_W = 640;      // world width of every stage; camera x is in [0, STAGE_W - W]
  SF.FPS = 60;           // fixed simulation rate

  // Global clock in seconds, advanced by core every simulation tick.
  SF.time = 0;
  SF.frame = 0;

  // ---- Registries -----------------------------------------------------------
  SF.Characters = {};    // id -> character definition (see SPEC.md §4)
  SF.Stages = {};        // id -> stage definition (see SPEC.md §5)
  SF.Scenes = SF.Scenes || {}; // shared scene art (title, select, map, ceremony, logo) — stages module
  SF.HEROES = ['bw4', 's4', 'abap', 'fiori'];
  SF.ENEMIES = ['orakle', 'snowflaker', 'databrickz', 'kinaxe', 'powerbeye', 'python'];
  // enemy id -> its home stage id
  SF.ENEMY_STAGE = {
    orakle: 'yacht', snowflaker: 'glacier', databrickz: 'lakehouse',
    kinaxe: 'port', powerbeye: 'skyline', python: 'garage'
  };

  SF.registerCharacter = function (def) {
    if (!def || !def.id) throw new Error('registerCharacter: missing id');
    SF.Characters[def.id] = def;
    return def;
  };
  SF.registerStage = function (def) {
    if (!def || !def.id) throw new Error('registerStage: missing id');
    SF.Stages[def.id] = def;
    return def;
  };

  // ---- Utilities ------------------------------------------------------------
  var U = SF.Util = {};
  U.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  U.lerp = function (a, b, t) { return a + (b - a) * t; };
  U.rand = function (a, b) { return a + Math.random() * (b - a); };
  U.randInt = function (a, b) { return Math.floor(a + Math.random() * (b - a + 1)); };
  U.pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  U.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  U.easeOut = function (t) { return 1 - (1 - t) * (1 - t); };
  U.easeIn = function (t) { return t * t; };
  U.easeInOut = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
  // deterministic pseudo-random from an integer seed (for stable background details)
  U.hash = function (n) {
    n = (n << 13) ^ n;
    return ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 0x7fffffff;
  };
  // Crisp pixel rectangle (rounds to whole pixels)
  U.rect = function (ctx, x, y, w, h, color) {
    if (color) ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  };
  // Shade a #rrggbb colour: amt in [-1, 1] (negative = darker)
  U.shade = function (hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
    else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
    var h = function (v) { v = Math.round(v); return (v < 16 ? '0' : '') + v.toString(16); };
    return '#' + h(r) + h(g) + h(b);
  };

  // ---- V2 HD rendering ----------------------------------------------------------
  // Gameplay still uses the 384x224 LOGICAL coordinate system. Core renders the main canvas at
  // SF.RES device pixels per logical pixel and pre-scales the context, so every module keeps drawing in
  // logical units but gets smooth, high-resolution output. Never reset a transform to identity:
  // use SF.Gfx.reset(ctx) instead (it restores the context's own base scale).
  SF.RES = 4;            // device pixels per logical pixel (core updates this on resize / quality change)
  SF.resVersion = 0;     // bumped by core whenever SF.RES changes — rebuild cached canvases when it differs
  SF.FONT_DISPLAY = '"Arial Black", "Helvetica Neue", Impact, "Segoe UI Black", sans-serif';
  SF.FONT_UI = '"Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif';

  var G = SF.Gfx = {};
  // Offscreen canvas of LOGICAL size w x h rendered at `res` (default SF.RES); ctx is pre-scaled.
  G.canvas = function (w, h, res) {
    res = res || SF.RES;
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w * res)); c.height = Math.max(1, Math.ceil(h * res));
    var x = c.getContext('2d');
    x._res = res; x.setTransform(res, 0, 0, res, 0, 0);
    x.imageSmoothingEnabled = true;
    return { canvas: c, ctx: x, w: w, h: h, res: res };
  };
  // Restore a context's base transform (logical units). Use instead of setTransform(1,0,0,1,0,0).
  G.reset = function (ctx) { var r = ctx._res || SF.RES; ctx.setTransform(r, 0, 0, r, 0, 0); };
  // Lazily painted cache that repaints automatically when the resolution changes.
  // painter(ctx, w, h) draws in logical units. Returns the canvas entry; draw it with
  // ctx.drawImage(entry.canvas, x, y, entry.w, entry.h).
  var caches = {};
  G.cached = function (key, w, h, painter, res) {
    var e = caches[key];
    if (!e || e.ver !== SF.resVersion || e.w !== w || e.h !== h) {
      e = G.canvas(w, h, res); e.ver = SF.resVersion; caches[key] = e;
      e.ctx.save(); painter(e.ctx, w, h); e.ctx.restore();
    }
    return e;
  };
  G.clearCaches = function () { caches = {}; };

  // ---- Fallback text renderer (core replaces SF.Text with the bitmap font) ----
  if (!SF.Text) {
    SF.Text = {
      width: function (str, scale) { return String(str).length * 6 * (scale || 1); },
      draw: function (ctx, str, x, y, o) {
        o = o || {}; var s = o.scale || 1; str = String(str).toUpperCase();
        var w = SF.Text.width(str, s);
        var ax = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
        ctx.save(); ctx.font = 'bold ' + (8 * s) + 'px monospace'; ctx.textBaseline = 'top';
        if (o.shadow !== false) { ctx.fillStyle = typeof o.shadow === 'string' ? o.shadow : '#000'; ctx.fillText(str, ax + s, y + s); }
        ctx.fillStyle = o.color || '#fff'; ctx.fillText(str, ax, y);
        ctx.restore(); return w;
      }
    };
  }
})(window.SF);


/* ===== 10_audio.js ===== */
/* SAP FIGHTER — 10_audio.js (owned by audio agent)
 * SF.Audio: 100% synthesised WebAudio music sequencer + SFX + speechSynthesis announcer.
 * No audio files. Every public function is a silent no-op without WebAudio / speechSynthesis or before unlock().
 *
 * CONTRACT NOTES (additive only, nothing required from other modules):
 *  - SF.Audio.say(text, { who, interrupt, stinger }) — `stinger: false` suppresses the short synth hit that is
 *    played under announcer lines (default: on for who === 'announcer').
 *  - Character voices read SF.Characters[who].voice = { pitch, rate } and optionally { prefer: 'regex-string' }
 *    to prefer a TTS voice by name.
 *  - Extras: SF.Audio.getVolume(kind), isMuted(), isUnlocked(), current() (playing music id or null),
 *    SF.Audio.TRACKS / JINGLES / SFX_IDS (id lists, used by dev/audio_test.html).
 *  - music(id) called before unlock() is remembered and starts as soon as unlock() succeeds.
 */
(function (SF) {
  'use strict';

  var A = SF.Audio = {};

  // ===========================================================================
  // Engine state
  // ===========================================================================
  var ctx = null, comp = null, master = null, musicBus = null, sfxBus = null, voiceBus = null, convolver = null;
  var noiseBuf = null, waves = {};
  var unlocked = false, muted = false;
  var vol = { master: 0.75, music: 0.5, sfx: 0.85, voice: 1 };
  var LOOKAHEAD = 0.12, TICK_MS = 25, MAX_SFX = 14;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function ready() { return !!(ctx && unlocked && ctx.state !== 'closed'); }
  function AudioCtor() { return window.AudioContext || window.webkitAudioContext || null; }
  function tc(x) { return Math.max(0.004, x); }   // safe time constant

  function buildGraph() {
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = muted ? 0 : vol.master;
    comp.connect(master);
    // soft-knee limiter curve as a final safety net (exactly linear below 0.6)
    var clip = ctx.createWaveShaper(), cn = 1024, curve = new Float32Array(cn);
    for (var ci = 0; ci < cn; ci++) { var x = (ci / (cn - 1)) * 2 - 1; var ax = Math.abs(x); curve[ci] = ax < 0.6 ? x : (x < 0 ? -1 : 1) * (0.6 + 0.4 * Math.tanh((ax - 0.6) / 0.4)); }
    clip.curve = curve; clip.oversample = 'none';
    master.connect(clip); clip.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = vol.music; musicBus.connect(comp);
    sfxBus = ctx.createGain(); sfxBus.gain.value = vol.sfx; sfxBus.connect(comp);
    voiceBus = ctx.createGain(); voiceBus.gain.value = vol.voice; voiceBus.connect(comp);
    // white noise (2 s, mono) shared by every noise voice
    var sr = ctx.sampleRate, len = Math.floor(sr * 2);
    noiseBuf = ctx.createBuffer(1, len, sr);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // small generated room/hall impulse for reverb sends
    var rl = Math.floor(sr * 1.7), ir = ctx.createBuffer(2, rl, sr);
    for (var ch = 0; ch < 2; ch++) {
      var b = ir.getChannelData(ch);
      for (var j = 0; j < rl; j++) b[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / rl, 2.6) * (j < sr * 0.006 ? j / (sr * 0.006) : 1);
    }
    convolver = ctx.createConvolver(); convolver.buffer = ir;
    var vr = ctx.createGain(); vr.gain.value = 0.55;
    convolver.connect(vr); vr.connect(comp);
    waves = {};
  }

  // Band-limited pulse waves (the classic chip "duty cycle" timbres)
  function pulseWave(duty) {
    var key = 'p' + duty;
    if (waves[key]) return waves[key];
    var n = 40, re = new Float32Array(n), im = new Float32Array(n);
    for (var k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
    waves[key] = ctx.createPeriodicWave(re, im);
    return waves[key];
  }
  function setType(osc, type) {
    if (type === 'p25') osc.setPeriodicWave(pulseWave(0.25));
    else if (type === 'p12') osc.setPeriodicWave(pulseWave(0.125));
    else osc.type = type || 'sine';
  }
  function noiseSrc(t, dur) {
    var s = ctx.createBufferSource();
    s.buffer = noiseBuf; s.loop = true;
    s.start(t, Math.random() * 1.8);
    s.stop(t + dur + 0.05);
    return s;
  }

  // ===========================================================================
  // Generic synth voice (used by every melodic channel)
  // P = { osc:[{type, det, mult, g}], f:{type,f,kt,amt,dec,q}, fm:{ratio,index,dec,sus}, vib:{rate,depth,delay},
  //       a, d, s, r, vol }
  // ===========================================================================
  function voice(dest, t, freq, dur, vel, P) {
    var a = P.a || 0.005, d = P.d || 0.2, s = P.s == null ? 0.7 : P.s, r = P.r || 0.08;
    var peak = Math.max(0.0002, vel * (P.vol || 0.3));
    var g = ctx.createGain(), gp = g.gain;
    gp.setValueAtTime(0, t);
    gp.linearRampToValueAtTime(peak, t + a);
    if (s < 1) gp.setTargetAtTime(peak * s, t + a, tc(d / 3));
    var rel = t + Math.max(a, dur);
    gp.setTargetAtTime(0, rel, tc(r / 3));
    var stopAt = rel + r * 2.5 + 0.03;
    var node = g;
    if (P.f) {
      var fl = ctx.createBiquadFilter();
      fl.type = P.f.type || 'lowpass';
      var base = Math.min(15000, P.f.f + freq * (P.f.kt || 0));
      var top = Math.min(16000, base + (P.f.amt || 0) * vel * vel);
      fl.frequency.setValueAtTime(top, t);
      if (P.f.amt) fl.frequency.setTargetAtTime(base, t + a * 0.5, tc((P.f.dec || 0.2) / 3));
      fl.Q.value = P.f.q || 0.7;
      fl.connect(g); node = fl;
    }
    var lfoG = null;
    if (P.vib && dur > P.vib.delay + 0.08) {
      var lfo = ctx.createOscillator(); lfo.frequency.value = P.vib.rate;
      lfoG = ctx.createGain();
      lfoG.gain.setValueAtTime(0, t);
      lfoG.gain.setValueAtTime(0, t + P.vib.delay);
      lfoG.gain.linearRampToValueAtTime(P.vib.depth, t + P.vib.delay + 0.18);
      lfo.connect(lfoG); lfo.start(t); lfo.stop(stopAt);
    }
    var mg = null;
    if (P.fm) {
      var mod = ctx.createOscillator(); mod.frequency.setValueAtTime(freq * P.fm.ratio, t);
      mg = ctx.createGain();
      var depth = P.fm.index * freq * P.fm.ratio * (0.6 + 0.4 * vel);
      mg.gain.setValueAtTime(depth, t);
      mg.gain.setTargetAtTime(depth * (P.fm.sus || 0), t, tc((P.fm.dec || 0.3) / 3));
      mod.connect(mg); mod.start(t); mod.stop(stopAt);
    }
    for (var i = 0; i < P.osc.length; i++) {
      var o = P.osc[i], osc = ctx.createOscillator();
      setType(osc, o.type);
      osc.frequency.setValueAtTime(freq * (o.mult || 1), t);
      if (o.det) osc.detune.setValueAtTime(o.det, t);
      if (lfoG) lfoG.connect(osc.detune);
      if (mg) mg.connect(osc.frequency);
      if (o.g != null && o.g !== 1) {
        var og = ctx.createGain(); og.gain.value = o.g; osc.connect(og); og.connect(node);
      } else osc.connect(node);
      osc.start(t); osc.stop(stopAt);
    }
    g.connect(dest);
  }

    brassSoft: { osc: [{ type: 'sawtooth', det: -9 }, { type: 'sawtooth', det: 9 }], f: { f: 500, kt: 1.2, amt: 1200, dec: 0.35, q: 1 }, a: 0.03, d: 0.4, s: 0.7, r: 0.12, vol: 0.16 },
    brassDark: { osc: [{ type: 'sawtooth', det: -8 }, { type: 'sawtooth', det: 8 }], f: { f: 300, kt: 1, amt: 1400, dec: 0.4, q: 2 }, a: 0.03, d: 0.5, s: 0.7, r: 0.18, vib: { rate: 5, depth: 10, delay: 0.3 }, vol: 0.34 },
    fmBrass:   { osc: [{ type: 'sine' }], fm: { ratio: 1, index: 2.6, dec: 0.35, sus: 0.55 }, a: 0.012, d: 0.4, s: 0.75, r: 0.1, vib: { rate: 6, depth: 14, delay: 0.2 }, vol: 0.4 },
    square:    { osc: [{ type: 'square', det: -6 }, { type: 'square', det: 6, g: 0.7 }], f: { f: 1800, kt: 1, amt: 1500, dec: 0.2, q: 0.8 }, a: 0.004, d: 0.25, s: 0.6, r: 0.08, vib: { rate: 6, depth: 12, delay: 0.2 }, vol: 0.19 },

      });
    });
  }
  // horizontal speed streaks behind a moving thing (seeded, scrolling)

 * SF.Fight.createMatch(opts) runs everything from the round intro to the match outro and draws the full
 * 384×224 screen (stage, fighters, effects, HUD, announcements). See SPEC.md §3.4.
 *
 * Sections:
 *   1. Constants & small helpers         7. Collisions & hit resolution
 *   2. Frame data (normals, specials)    8. Effects (sparks, dust, shake, popups)
 *   3. Input conversion & motion buffer  9. CPU AI (levels 1..8)
 *   4. Fighter creation & reset          10. Round / match flow, scoring
 *   5. Fighter state machine             11. Drawing (world, super flash, HUD, announcements)
 *   6. Special moves (10 generic types)  12. Public API
 *
 * CONTRACT NOTES (assumptions about other modules):
 *  - Inputs: SF.Input.get(i) objects; a missing `pressed` map is tolerated (treated as no edges).
 *  - def.drawFx is called with f = { age, life, phase, w, h, t, alt }; projectiles/rain drops use
 *    w/h = move.size (default 24×20); beams use w = current beam length, h = beam height.
 *    The 'screen' type is drawn in screen space with w=384, h=224 and phase 'active'.
 *  - Character/stage draw calls are wrapped in try/catch so one broken pose cannot crash a match;
 *    failures are logged once per key via console.warn and counted in SF.Fight.errors.
 *  - Unknown character ids fall back to the first registered character; an unknown stage id falls back to
 *    a plain built-in arena. opts.roundTime <= 0 means no time limit.
 *  - m.result.perfect is true when the match winner never lost any health during the whole match.
 *  - Audio: the stage music is started once at match start; jingles ('win'/'lose') are only used at the
 *    match outro so music never needs restarting between rounds.
 *  - The 'slam' shockwave is unblockable (it "must be jumped"); 'grab' and throws are unblockable.
 *
 * V2 HD RENDERING NOTES (SPEC-V2 §2/§5) — rendering only, gameplay is untouched:
 *  - All drawing is in logical 384x224 units on the core's pre-scaled context; no identity resets. Offscreen
 *    sprites (glows, sparks, ink splashes, dust, brush strokes, speed lines, announcement/move-name text, HUD
 *    frames, portraits) come from SF.Gfx.cached; afterimage/rim-light silhouettes use SF.Gfx.canvas at RES/2.
 *    No per-frame shadowBlur/filter (shadowBlur is only used while painting caches).
 *  - Camera zoom 1.0..1.2 (in only) is a transform around a pivot inside the frame at/near ground level, so the
 *    zoomed view is always a subset of the unzoomed gameplay camera; drawBack/drawFront get info.zoom. HUD,
 *    cut-in, announcements and 'screen' drawFx are drawn without zoom.
 *  - Visual state lives in m.vfx (updated once per tick by updateVisuals); visual randomness uses a private
 *    generator (VR), never Math.random, so AI/gameplay random streams are identical to V1.
 *  - Blend modes 'saturation' / 'multiply' are used for the super freeze and the KO impact frame.
 *  - SF.Fight.perf: set perf.on = true to accumulate draw timings per section (stage/fighters/fx/hud/total).
 */
(function (SF) {
  'use strict';

  // 1. CONSTANTS & SMALL HELPERS
  // =====================================================================================================
  var W = SF.W, H = SF.H, GY = SF.GROUND_Y, STW = SF.STAGE_W;
  var CAM_MAX = STW - W;
  var GRAV = 0.36;              // px/frame² for jumps and juggles
  var WALL = 20;                // closest a fighter's centre may get to the stage edge
  var SCR_M = 20;               // ... and to the screen edge
  var MAXD = W - 2 * SCR_M;     // max distance between fighters
  var STUN_MAX = 100;           // stun meter threshold for dizzy
  var JUGGLE_MAX = 4;           // max extra hits on an airborne (juggled) opponent
  var OUTLINE = '#140c1c';
  var R = Math.random;

  function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function sign(v) { return v < 0 ? -1 : 1; }
  function pad(n, len) { var s = String(Math.max(0, Math.floor(n))); while (s.length < len) s = '0' + s; return s; }
  function txt(ctx, str, x, y, o) { return SF.Text.draw(ctx, str, Math.round(x), Math.round(y), o || {}); }
  function txtW(str, scale) { return SF.Text.width ? SF.Text.width(str, scale) : String(str).length * 6 * scale; }

  // Errors raised by other modules' draw code are swallowed (logged once) so the match keeps running.
  var warned = {};
  function safe(key, fn) {
    try { fn(); } catch (e) {
      Fight.errors++;
      if (!warned[key]) { warned[key] = 1; if (typeof console !== 'undefined') console.warn('SF.Fight: ' + key + ' failed: ' + e); }
    }
  }

  // ---- audio wrappers (all guarded: audio module is optional) ----
  function sfx(id, o) { var a = SF.Audio; if (a && a.sfx && id) { try { a.sfx(id, o || {}); } catch (e) { /* ignore */ } } }
  function say(text, who, interrupt) {
    var a = SF.Audio; if (a && a.say && text) { try { a.say(text, { who: who || 'announcer', interrupt: !!interrupt }); } catch (e) { /* ignore */ } }
  }
  function music(id) { var a = SF.Audio; if (a && a.music && id) { try { a.music(id); } catch (e) { /* ignore */ } } }
  function jingle(id) { var a = SF.Audio; if (a && a.jingle && id) { try { a.jingle(id); } catch (e) { /* ignore */ } } }
  function sfxAt(m, id, x, vol, pitch) {
    var o = { pan: clamp((x - m.cam - W / 2) / (W / 2), -1, 1) * 0.6 };
    if (vol !== undefined) o.vol = vol;
    if (pitch !== undefined) o.pitch = pitch;
    sfx(id, o);
  }

  var NUMWORD = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];

  // =====================================================================================================
  // 2. FRAME DATA
  // =====================================================================================================
  // Normal attacks. box = [x0, y0, x1, y1] relative to the feet, facing right (y scaled by height/88).
  // Reaches match the pose contract in SPEC §4.1.
  var NORMALS = {
    sp: { pose: 'punch', startup: 4, active: 4, recovery: 9, dmg: 45, kind: 'light', level: 'mid',
      box: [12, -70, 44, -54], hurt: [10, -68, 36, -56], hitstun: 15, blockstun: 10, push: 3.2, swish: 'swish_light' },
    sk: { pose: 'kick', startup: 7, active: 5, recovery: 13, dmg: 70, kind: 'heavy', level: 'mid',
      box: [14, -57, 52, -39], hurt: [12, -56, 42, -42], hitstun: 19, blockstun: 13, push: 4.2, swish: 'swish_heavy' },
    cp: { pose: 'cpunch', startup: 4, active: 3, recovery: 8, dmg: 35, kind: 'light', level: 'mid', crouch: true,
      box: [12, -42, 40, -27], hurt: [10, -40, 32, -29], hitstun: 15, blockstun: 9, push: 3.0, swish: 'swish_light' },
    ck: { pose: 'ckick', startup: 7, active: 5, recovery: 16, dmg: 60, kind: 'heavy', level: 'low', crouch: true,
      box: [12, -13, 54, 0], hurt: [10, -12, 44, -1], hitstun: 18, blockstun: 12, push: 3.6, swish: 'swish_heavy', knockdown: true },
    jp: { pose: 'jpunch', startup: 4, active: 9, recovery: 10, dmg: 55, kind: 'light', level: 'overhead', air: true,
      box: [8, -44, 38, -20], hitstun: 17, blockstun: 11, push: 2.8, swish: 'swish_light' },
    jk: { pose: 'jkick', startup: 5, active: 10, recovery: 10, dmg: 70, kind: 'heavy', level: 'overhead', air: true,
      box: [10, -40, 42, -14], hitstun: 19, blockstun: 12, push: 3.2, swish: 'swish_heavy' }
  };
  var THROW_DMG = 120;
  // Damage multiplier for the n-th hit of a combo.
  var COMBO_SCALE = [1, 1, 0.85, 0.75, 0.65, 0.58, 0.52, 0.48, 0.45, 0.42];
  var HITSTOP = { light: 7, heavy: 10, special: 11, super: 7 };
  var HIT_SCORE = { light: 100, heavy: 200, special: 500, super: 800 };

  // Defaults for the 10 generic special types (character data overrides any of these).
  var SPECIAL_DEFAULTS = {
    projectile: { startup: 12, recovery: 22, speed: 4, size: [24, 20], hits: 1 },
    rush: { startup: 9, recovery: 16, speed: 6.5, distance: 110, hits: 1 },
    rising: { startup: 3, recovery: 12, hits: 1, rise: 72 },
    counter: { startup: 3, window: 30, recovery: 14, hits: 1 },
    teleport: { startup: 16, recovery: 16, hits: 1 },
    grab: { startup: 5, recovery: 24, distance: 52, hits: 1 },
    slam: { startup: 6, recovery: 18, speed: 4.5, distance: 300, hits: 1, size: [40, 24] },
    beam: { startup: 18, active: 44, recovery: 18, distance: 340, hits: 6, size: [0, 26] },
    rain: { startup: 16, recovery: 30, hits: 8, size: [22, 22], speed: 5 },
    screen: { startup: 24, active: 40, recovery: 14, hits: 5 }
  };
  var SUPER_DEFAULT_HITS = { projectile: 3, rush: 5, rising: 3, counter: 1, teleport: 3, grab: 1, slam: 1, beam: 8, rain: 10, screen: 6 };

  // Normalise a special/super definition from character data into a config with all fields filled.
  function normSpecial(mv, isSuper) {
    if (!mv || typeof mv !== 'object') return null;
    var type = SPECIAL_DEFAULTS[mv.type] ? mv.type : 'rush';
    var dft = SPECIAL_DEFAULTS[type];
    var c = {
      src: mv, type: type, isSuper: !!isSuper,
      name: String(mv.name || (isSuper ? 'SUPER' : 'SPECIAL')).toUpperCase(),
      damage: Math.max(1, num(mv.damage, isSuper ? 300 : 100)),
      hits: Math.max(1, Math.round(num(mv.hits, isSuper ? SUPER_DEFAULT_HITS[type] : dft.hits))),
      speed: Math.max(0.5, num(mv.speed, dft.speed || 4)),
      distance: Math.max(20, num(mv.distance, dft.distance || 110)),
      startup: Math.max(1, Math.round(num(mv.startup, dft.startup))),
      recovery: Math.max(1, Math.round(num(mv.recovery, dft.recovery))),
      active: Math.max(4, Math.round(num(mv.active, dft.active || 30))),
      window: dft.window || 30,
      rise: num(mv.rise, dft.rise || 72),
      arc: !!mv.arc,
      size: [24, 20],
      shout: mv.shout || '', sfx: mv.sfx || 'hit_special', fx: mv.fx || ''
    };
    var sz = mv.size || dft.size;
    if (sz && sz.length >= 2) c.size = [Math.max(4, num(sz[0], 24)), Math.max(4, num(sz[1], 20))];
    if (type === 'beam' && !(mv.size && mv.size.length >= 2)) c.size = [0, isSuper ? 30 : 24];
    if (type === 'rush' && isSuper && mv.speed === undefined) c.speed = 7;
    if (type === 'grab' && mv.distance === undefined) c.distance = 52;
    if (type === 'slam' && mv.distance === undefined) c.distance = 300;
    if (type === 'rush' && mv.distance === undefined) c.distance = isSuper ? 160 : 110;
    if (type === 'beam' && mv.distance === undefined) c.distance = 340;
    return c;
  }

  // =====================================================================================================
  // 3. INPUT CONVERSION & MOTION BUFFER
  // =====================================================================================================
  // Internal input: facing-relative f/b, absolute L/R, held buttons P/K/S and press edges pP/pK/pS.
  function relInput() {
    return { f: false, b: false, u: false, d: false, L: false, R: false, P: false, K: false, S: false,
      pP: false, pK: false, pS: false, any: false };
  }
  function fromRaw(raw, dir) {
    var r = relInput();
    if (!raw) return r;
    var pr = raw.pressed || {};
    var left = !!raw.left, right = !!raw.right;
    if (left && right) left = right = false;
    r.L = left; r.R = right;
    r.f = dir > 0 ? right : left;
    r.b = dir > 0 ? left : right;
    r.u = !!raw.up && !raw.down;
    r.d = !!raw.down && !raw.up;
    r.P = !!raw.punch; r.K = !!raw.kick; r.S = !!raw.special;
    r.pP = !!pr.punch; r.pK = !!pr.kick; r.pS = !!pr.special;
    r.any = !!(pr.punch || pr.kick || pr.special || pr.left || pr.right || pr.up || pr.down);
    return r;
  }
  // AI produces facing-relative intents; derive absolute L/R from them.
  function finishRel(r, dir) {
    r.L = dir > 0 ? r.b : r.f;
    r.R = dir > 0 ? r.f : r.b;
    r.any = r.pP || r.pK || r.pS;
    return r;
  }
  // Numpad notation (facing-relative): 1 db, 2 d, 3 df, 4 b, 5 n, 6 f, 7 ub, 8 u, 9 uf
  function numpad(r) {
    if (r.d) return r.f ? 3 : r.b ? 1 : 2;
    if (r.u) return r.f ? 9 : r.b ? 7 : 8;
    return r.f ? 6 : r.b ? 4 : 5;
  }
  var BUF_LEN = 24, MOTION_WINDOW = 20, FRESH = 3;
  function recordInput(f, inp) {
    f.input = inp;
    f.buf.push(numpad(inp));
    if (f.buf.length > BUF_LEN) f.buf.shift();
    if (inp.pP) f.pa.P = 0;
    if (inp.pK) f.pa.K = 0;
    if (inp.pS) f.pa.S = 0;
    if (inp.any) f.mash++;
  }
  function ageInputs(f) { f.pa.P++; f.pa.K++; f.pa.S++; }
  function fresh(f, b) { return f.pa[b] <= FRESH; }
  function consume(f, b) { f.pa[b] = 99; }
  function consumeAll(f) { f.pa.P = f.pa.K = f.pa.S = 99; }
  // True if seq (numpad dirs) appears in order within the motion window, ending recently.
  function motion(f, seq) {
    var b = f.buf, n = b.length, k = seq.length - 1;
    for (var i = n - 1; i >= 0 && n - 1 - i <= MOTION_WINDOW; i--) {
      if (b[i] === seq[k]) {
        if (k === seq.length - 1 && n - 1 - i > 8) return false;
        k--;
        if (k < 0) return true;
      }
    }
    return false;
  }
  // Which special the current input requests: 0,1,2 (special1..3), 'super' or null.
  function readSpecialCmd(f, inp) {
    if (fresh(f, 'S')) {
      if (inp.b && f.meter >= 100 && f.superMv) return 'super';
      if (inp.d) return 2;
      if (inp.f) return 1;
      return 0;
    }
    if (fresh(f, 'P')) {
      if (motion(f, [6, 2, 3])) return 2;   // →↓↘ + P
      if (motion(f, [2, 3, 6])) return 0;   // ↓↘→ + P
    }
    if (fresh(f, 'K')) {
      if (motion(f, [2, 1, 4])) return 1;   // ↓↙← + K
    }
    return null;
  }

  // =====================================================================================================
  // 4. FIGHTER CREATION & RESET
  // =====================================================================================================
  function makeFighter(m, side, id, alt, cpu, level) {
    var def = SF.Characters[id];
    var s = def.stats || {};
    var walk = clamp(num(s.walk, 1.6), 0.5, 4);
    var f = {
      side: side, id: id, def: def, alt: !!alt, cpu: !!cpu,
      name: String(def.name || id).toUpperCase(),
      color: (def.colors && def.colors.primary) || (side ? '#c03030' : '#3050c0'),
      accent: (def.colors && (def.colors.accent || def.colors.secondary)) || '#ffd040',
      h: clamp(num(def.height, 88), 50, 140),
      w: clamp(num(def.width, 32), 16, 60),
      stats: {
        walk: walk, back: clamp(num(s.back, walk * 0.75), 0.4, 4),
        jumpV: clamp(num(s.jumpV, 7), 4, 10), jumpX: clamp(num(s.jumpX, 2.6), 1, 5),
        power: clamp(num(s.power, 1), 0.5, 2), defense: clamp(num(s.defense, 1), 0.5, 2),
        health: Math.round(clamp(num(s.health, 1000), 100, 5000))
      },
      specials: [], superMv: null,
      score: 0, wins: 0, meter: 0, lostHealth: false,
      buf: [], pa: { P: 99, K: 99, S: 99 }, input: relInput(), mash: 0
    };
    f.hs = f.h / 88;
    f.handY = -58 * f.hs;
    f.maxHp = f.stats.health;
    for (var i = 0; i < 3; i++) f.specials.push(normSpecial(def.specials && def.specials[i], false));
    f.superMv = normSpecial(def.super, true);
    f.ai = cpu ? makeAI(level, f) : null;
    return f;
  }

  function resetFighter(f, x, dir, intro) {
    f.x = x; f.y = 0; f.vx = 0; f.vy = 0; f.push = 0; f.dir = dir;
    f.hp = f.maxHp; f.redHp = f.maxHp; f.redT = 0;
    f.state = intro ? 'intro' : 'idle'; f.st = 0; f.waitT = 0;
    f.move = null; f.sp = null; f.victim = null; f.heldBy = null;
    f.air = false; f.crouching = false; f.airUsed = false; f.jdur = 40; f.jumpSeq = 0;
    f.inv = 0; f.flash = 0; f.alpha = 1; f.juggle = 0; f.koFall = false;
    f.stun = 0; f.stunT = 0; f.pendingDizzy = false; f.dizzyImm = 0;
    f.combo = 0; f.comboShowN = 0; f.comboShowT = 0; f.lostHealth = false;
    f.buf.length = 0; consumeAll(f); f.input = relInput();
    if (f.ai) aiReset(f.ai);
  }

  function setState(f, s) { if (f.state !== s) { f.state = s; f.st = 0; } }
  function forceState(f, s) { f.state = s; f.st = 0; }
  function face(f, o) { if (Math.abs(o.x - f.x) > 0.5) f.dir = o.x > f.x ? 1 : -1; }

  var NEUTRAL = { idle: 1, walk: 1, walkback: 1, crouch: 1, guard: 1 };
  var THROWABLE = { idle: 1, walk: 1, walkback: 1, crouch: 1, guard: 1, attack: 1, land: 1, prejump: 1 };

  // =====================================================================================================
  // 5. FIGHTER STATE MACHINE
  // =====================================================================================================
  function stepFighter(m, f, o) {
    f.st++;
    if (f.inv > 0) f.inv--;
    if (f.dizzyImm > 0) f.dizzyImm--;
    if (f.flash > 0) f.flash = Math.max(0, f.flash - 0.1);
    var inp = f.input;
    switch (f.state) {
      case 'intro': f.vx = 0; break;
      case 'idle': case 'walk': case 'walkback': case 'crouch': case 'guard':
        neutral(m, f, o, inp); break;
      case 'prejump':
        f.vx = 0;
        if (f.st >= 3) startJump(m, f, inp);
        break;
      case 'jump': airStep(m, f, o, inp); break;
      case 'land':
        f.vx = 0;
        if (f.st >= f.waitT) toNeutral(m, f, o);
        break;
      case 'attack': attackStep(m, f, o, inp); break;
      case 'block':
        f.vx = 0;
        if (f.st >= f.waitT) toNeutral(m, f, o);
        break;
      case 'hit':
        f.vx = 0;
        if (f.st >= f.waitT) toNeutral(m, f, o);
        break;
      case 'air': break;   // physics handles the flight and landing
      case 'down':
        f.vx *= 0.8;
        if (!f.koFall && f.st >= 36) { forceState(f, 'getup'); sfxAt(m, 'swish_light', f.x, 0.4); }
        break;
      case 'getup':
        f.vx = 0;
        if (f.st >= 26) { f.inv = 8; toNeutral(m, f, o); }
        break;
      case 'dizzy':
        f.vx = 0;
        if (inp.any) f.st += 3;   // mashing shortens the stun
        if (f.st >= f.waitT) { f.stun = 0; f.dizzyImm = 240; toNeutral(m, f, o); }
        break;
      case 'throw': throwStep(m, f, o); break;
      case 'held': break;     // positioned by the attacker
      case 'special': specialStep(m, f, o); break;
      case 'ko': f.vx *= 0.88; break;
      default: break;
    }
  }

  // Return to a neutral, controllable stance (or dizzy, if the stun meter overflowed).
  function toNeutral(m, f, o) {
    f.move = null; f.sp = null; f.vx = 0; f.air = false; f.alpha = 1; f.victim = null;
    f.crouching = !!(f.input && f.input.d);
    f.y = 0; f.vy = 0; f.juggle = 0;
    face(f, o);
    if (f.pendingDizzy && m.phase === 'fight' && f.hp > 0) {
      f.pendingDizzy = false;
      forceState(f, 'dizzy'); f.waitT = 150; f.crouching = false;
      sfxAt(m, 'dizzy', f.x); sfx('crowd_gasp', { vol: 0.6 });
      addPop(m, 'DIZZY!', f.x, -f.h - 10, '#ffe040');
      m.excite = Math.min(1, m.excite + 0.2);
      return;
    }
    forceState(f, f.crouching ? 'crouch' : 'idle');
  }

  function holdingAway(f, o, inp) {
    if (o.x > f.x + 0.5) return inp.L;
    if (o.x < f.x - 0.5) return inp.R;
    return inp.b;
  }

  function neutral(m, f, o, inp) {
    f.vx = 0; f.air = false;
    face(f, o);
    if (!m.control) { f.crouching = false; setState(f, 'idle'); return; }
    if (tryStartSpecial(m, f, o, inp)) return;
    if (inp.u) { f.crouching = false; setState(f, 'prejump'); return; }
    var crouch = inp.d;
    if (fresh(f, 'P')) {
      consume(f, 'P');
      if (!crouch && inp.f && canThrow(m, f, o)) startThrow(m, f, o);
      else startNormal(m, f, crouch ? 'cp' : 'sp');
      return;
    }
    if (fresh(f, 'K')) { consume(f, 'K'); startNormal(m, f, crouch ? 'ck' : 'sk'); return; }
    var threat = holdingAway(f, o, inp) && threatened(m, f, o);
    if (crouch) { f.crouching = true; setState(f, threat ? 'guard' : 'crouch'); return; }
    f.crouching = false;
    if (threat) { setState(f, 'guard'); return; }
    if (inp.f) { setState(f, 'walk'); f.vx = f.dir * f.stats.walk; }
    else if (inp.b) { setState(f, 'walkback'); f.vx = -f.dir * f.stats.back; }
    else setState(f, 'idle');
  }

  // Is the opponent doing something that should make a back-holding fighter raise their guard?
  function threatened(m, f, o) {
    var d = Math.abs(o.x - f.x);
    if (d < 150) {
      if (o.state === 'attack' && o.move && o.move.t < o.move.d.startup + o.move.d.active) return true;
      if (o.state === 'jump' && o.move) return true;
      if (o.state === 'special' && o.sp && spPhase(o) !== 'recovery') return true;
    }
    if (o.state === 'special' && o.sp && (o.sp.type === 'beam' || o.sp.type === 'screen') && spPhase(o) !== 'recovery') return true;
    for (var i = 0; i < m.ents.length; i++) {
      var e = m.ents[i];
      if (e.owner !== o || e.dead || e.phase === 'hit') continue;
      if ((e.kind === 'proj' || e.kind === 'wave') && Math.abs(e.x - f.x) < 120) return true;
      if (e.kind === 'drop' || e.kind === 'rainer') return true;
    }
    return false;
  }

  function startNormal(m, f, key) {
    var d = NORMALS[key];
    f.move = { key: key, d: d, t: 0, hitsDone: 0, connected: false, id: ++m.seq };
    forceState(f, 'attack');
    f.crouching = !!d.crouch;
    f.vx = 0;
    m.topSide = f.side;
  }

  function attackStep(m, f, o, inp) {
    var mv = f.move;
    if (!mv) { toNeutral(m, f, o); return; }
    var d = mv.d;
    mv.t++;
    f.vx = 0;
    if (mv.t === d.startup) sfxAt(m, d.swish, f.x, 0.8);
    // special cancel: a normal that connected (hit or block) can be cancelled into a special
    if (mv.connected && mv.t <= d.startup + d.active + 8 && m.control && tryStartSpecial(m, f, o, inp)) return;
    if (mv.t >= d.startup + d.active + d.recovery) toNeutral(m, f, o);
  }

  function startJump(m, f, inp) {
    var jd = inp.f ? 1 : inp.b ? -1 : 0;
    forceState(f, 'jump');
    f.air = true; f.crouching = false; f.move = null; f.airUsed = false;
    f.jumpSeq = ++m.seq;
    f.vy = -f.stats.jumpV;
    f.vx = jd * f.dir * f.stats.jumpX;
    f.jdur = 2 * f.stats.jumpV / GRAV;
    sfxAt(m, 'jump', f.x, 0.6);
  }

  function airStep(m, f, o, inp) {
    if (f.move) {
      f.move.t++;
      if (f.move.t === f.move.d.startup) sfxAt(m, f.move.d.swish, f.x, 0.8);
      return;
    }
    if (f.airUsed || !m.control) return;
    var key = fresh(f, 'K') ? 'jk' : fresh(f, 'P') ? 'jp' : null;
    if (key) {
      consume(f, key === 'jk' ? 'K' : 'P');
      f.airUsed = true;
      f.move = { key: key, d: NORMALS[key], t: 0, hitsDone: 0, connected: false, id: ++m.seq };
      m.topSide = f.side;
    }
  }

  // ---- physics ----
  function physics(m, f) {
    if (f.state === 'held') return;
    if (f.push) { f.x += f.push; f.push *= 0.78; if (Math.abs(f.push) < 0.15) f.push = 0; }
    f.x += f.vx;
    if (f.air) {
      f.vy += GRAV;
      f.y += f.vy;
      if (f.y >= 0 && f.vy >= 0) land(m, f);
    } else if (f.y < 0) {
      f.y = Math.min(0, f.y + 4);
    } else f.y = 0;
  }

  function land(m, f) {
    f.y = 0; f.vy = 0;
    switch (f.state) {
      case 'jump':
        f.air = false; f.vx = 0;
        forceState(f, 'land'); f.waitT = f.move ? 5 : 3; f.move = null;
        sfxAt(m, 'land', f.x, 0.6);
        spawnDust(m, f.x, 4, false);
        break;
      case 'air':
        f.air = false; f.vx *= 0.35; f.juggle = 0;
        forceState(f, f.koFall ? 'ko' : 'down');
        sfxAt(m, 'fall', f.x);
        spawnDust(m, f.x, 9, true);
        addShake(m, 3);
        break;
      case 'special':
        if (f.sp && TYPES[f.sp.type].land) TYPES[f.sp.type].land(m, f, f.sp);
        else { f.air = false; f.vx = 0; }
        break;
      default:
        f.air = false; f.vx = 0;
        break;
    }
  }

  // ---- throws (forward + punch when close) ----
  function canThrow(m, f, o) {
    if (o.air || o.y < 0 || !THROWABLE[o.state] || o.inv > 0) return false;
    var dx = o.x - f.x;
    return Math.abs(dx) <= (f.w + o.w) / 2 + 16 && sign(dx) === f.dir;
  }
  function startThrow(m, f, o) {
    forceState(f, 'throw');
    f.victim = o; f.vx = 0; f.crouching = false;
    grabVictim(m, f, o);
    sfxAt(m, 'throw', f.x);
    m.topSide = f.side;
  }
  function grabVictim(m, f, o) {
    cancelMoves(m, o);
    forceState(o, 'held');
    o.heldBy = f; o.vx = 0; o.vy = 0; o.push = 0; o.air = false; o.crouching = false;
  }
  function throwStep(m, f, o) {
    var t = f.st, v = f.victim;
    if (v && v.state === 'held' && v.heldBy === f) {
      if (t <= 8) { v.x = f.x + f.dir * 26; v.y = -t * 1.5; }
      else if (t < 20) {
        var a = Math.PI * (t - 8) / 12;
        v.x = f.x + f.dir * 26 * Math.cos(a); v.y = -12 - 36 * Math.sin(a);
      } else if (t === 20) {
        v.x = clamp(f.x - f.dir * 30, WALL, STW - WALL);
        v.y = -14;
        v.heldBy = null;
        forceState(v, 'air'); v.air = true;
        applyHit(m, f, v, { dmg: THROW_DMG, kind: 'heavy', level: 'unblockable', force: true, knockdown: true,
          vy: -3, kb: 2.6, awayDir: -f.dir, hitstun: 20, blockstun: 0, push: 0, melee: false, fromX: f.x,
          sx: v.x, sy: v.y - v.h * 0.5, sfx: 'hit_heavy', hitstop: 8 });
        addShake(m, 4);
      }
    }
    if (t >= 32) toNeutral(m, f, o);
  }

  // Interrupt whatever a fighter was doing (when hit or grabbed).
  function cancelMoves(m, f) {
    if (f.victim && f.victim.heldBy === f) {
      var v = f.victim; v.heldBy = null; forceState(v, 'air'); v.air = true; v.vy = -2; v.vx = 0;
    }
    f.victim = null; f.move = null; f.sp = null; f.alpha = 1; f.vx = 0;
  }

  // =====================================================================================================
  // 6. SPECIAL MOVES — the 10 generic types of SPEC §4.2
  // =====================================================================================================
  // Every type implements:  start(m,f,o,sp)  step(m,f,o,sp)  and optionally
  //   hitbox(m,f,sp) -> {box, d} | null      melee hitbox for the collision pass
  //   land(m,f,sp)                            called when an airborne special touches the floor
  //   fx(m,f,sp) -> {age, life, phase, ...}   effect drawn at the fighter (drawFx)
  //   p(sp) -> 0..1                           pose progress (default sp.t / sp.total)
  //   invuln(sp) -> bool                      extra invulnerability
  function tryStartSpecial(m, f, o, inp) {
    var cmd = readSpecialCmd(f, inp);
    if (cmd === null) return false;
    var mv = cmd === 'super' ? f.superMv : f.specials[cmd];
    if (!mv) return false;
    if (mv.type === 'projectile' && !mv.isSuper && ownProjectile(m, f)) return false;
    consumeAll(f);
    f.buf.length = 0;
    startSpecial(m, f, o, mv, cmd);
    return true;
  }

  function ownProjectile(m, f) {
    for (var i = 0; i < m.ents.length; i++) {
      var e = m.ents[i];
      if (e.kind === 'proj' && e.owner === f && !e.dead && e.phase === 'travel') return true;
    }
    return false;
  }

  function startSpecial(m, f, o, mv, idx) {
    var sp = {
      mv: mv, type: mv.type, idx: idx, isSuper: idx === 'super', t: 0, total: 30,
      pose: idx === 'super' ? 'super' : 'special' + (idx + 1),
      hitsDone: 0, lastHitT: -99, connected: false, id: ++m.seq
    };
    cancelMoves(m, f);
    f.sp = sp;
    forceState(f, 'special');
    f.crouching = false; f.air = false; f.vx = 0;
    face(f, o);
    m.topSide = f.side;
    TYPES[sp.type].start(m, f, o, sp);
    f.meter = Math.min(100, f.meter + (sp.isSuper ? 0 : 1.5));
    if (sp.isSuper) {
      f.meter = 0;
      m.superFlash = { f: f, t: 0, len: 62, name: mv.name };
      sfx('super_flash');
      m.excite = Math.min(1, m.excite + 0.3);
      addScore(m, f, 500);
    } else addScore(m, f, 100);
    say(mv.shout, f.id, sp.isSuper);
  }

  function specialStep(m, f, o) {
    var sp = f.sp;
    if (!sp) { toNeutral(m, f, o); return; }
    sp.t++;

    if (f.sp === sp && sp.t > sp.total + 120) toNeutral(m, f, o);   // safety net
  }

  // 'startup' | 'active' | 'recovery' — used by guard logic and the AI.
  function spPhase(f) {
    var sp = f.sp; if (!sp) return 'recovery';
    if (sp.t < sp.mv.startup) return 'startup';
    if (sp.landed || sp.t >= sp.total - sp.mv.recovery) return 'recovery';
    if (sp.type === 'counter' && sp.triggered) return 'active';
    return 'active';
  }

  function spDesc(f, sp, extra) {
    var mv = sp.mv;
    var d = {
      dmg: mv.damage / mv.hits, kind: sp.isSuper ? 'super' : 'special', level: 'mid',
      hitstun: 22, blockstun: 16, push: 2.5, melee: true, fromX: f.x, src: sp,
      sfx: 'hit_special', hitstop: sp.isSuper ? 6 : HITSTOP.special, special: true

    if (extra) for (var k in extra) d[k] = extra[k];
    return d;
  }
  function canMultiHit(sp, interval) {
    return sp.hitsDone < sp.mv.hits && (sp.hitsDone === 0 || sp.t - sp.lastHitT >= interval);
  }
  // Box relative to a fighter's feet, facing right; absolute local coordinates.
  function lbox(f, x0, y0, x1, y1) {
    var a = f.x + f.dir * x0, b = f.x + f.dir * x1;
    return { x0: Math.min(a, b), x1: Math.max(a, b), y0: f.y + y0, y1: f.y + y1 };
  }

  var TYPES = {};

  // ---- projectile: fireball at hand height, optional gravity arc, clashes with other projectiles ----
  TYPES.projectile = {
    start: function (m, f, o, sp) { sp.total = sp.mv.startup + sp.mv.recovery; },
    step: function (m, f, o, sp) {
      if (sp.t === sp.mv.startup) { spawnProjectile(m, f, o, sp); sfxAt(m, sp.mv.sfx, f.x); }
      if (sp.t >= sp.total) toNeutral(m, f, o);
    }
  };
  function spawnProjectile(m, f, o, sp) {
    var c = sp.mv, e = {
      kind: 'proj', owner: f, sp: sp, mv: c, x: f.x + f.dir * 30, y: f.y + f.handY, dir: f.dir,
      vx: f.dir * c.speed, vy: 0, grav: 0, w: c.size[0], h: c.size[1],
      hits: c.hits, hitsDone: 0, lastHitT: -99, t: 0, age: 0, life: 0, phase: 'travel', dead: false, id: ++m.seq
    };

      e.vx = f.dir * clamp(dist / 60, 1.4, Math.max(1.6, num(c.src.speed, 4.2)));
      e.vy = -5.2; e.grav = 0.2;
    }
    m.ents.push(e);
  }

  // ---- rush: dash forward `distance` px with a multi-hit active hitbox ----
  TYPES.rush = {
    start: function (m, f, o, sp) {
      var c = sp.mv;
      sp.act = Math.max(6, Math.ceil(c.distance / c.speed));
      sp.total = c.startup + sp.act + c.recovery;
      sp.interval = Math.max(3, Math.floor(sp.act / c.hits));
    },
    step: function (m, f, o, sp) {
      var c = sp.mv, a = sp.t - c.startup;
      if (a === 0) sfxAt(m, c.sfx, f.x);
      if (a >= 0 && a < sp.act && !sp.stopped) {
        f.vx = f.dir * c.speed;
        if (a % 4 === 0) spawnDust(m, f.x - f.dir * 10, 1, false);
      } else f.vx = 0;
      if (sp.hitsDone >= c.hits && !sp.stopped) {
        sp.stopped = true;
        sp.t = Math.max(sp.t, c.startup + sp.act);   // skip straight to recovery
      }
      if (sp.t >= sp.total) toNeutral(m, f, o);
    },
    hitbox: function (m, f, sp) {
      var c = sp.mv, a = sp.t - c.startup;
      if (a < 0 || a >= sp.act + 2 || sp.stopped || !canMultiHit(sp, sp.interval)) return null;
      var last = sp.hitsDone >= c.hits - 1;
      return { box: lbox(f, -6, -f.h * 0.9, 42, -6),
        d: spDesc(f, sp, { knockdown: last, push: last ? 3.6 : 0.4, hitstun: 26, kb: 2.6, hitstop: last ? HITSTOP.special : 5 }) };
    },
    fx: function (m, f, sp) {
      var a = sp.t - sp.mv.startup;
      if (a < 0 || a > sp.act + 8) return null;
      return { age: a, life: sp.act + 8, phase: 'active' };
    }
  };

  // ---- rising: invulnerable anti-air uppercut ----
  TYPES.rising = {
    start: function (m, f, o, sp) {
      var c = sp.mv;
      sp.v0 = Math.sqrt(2 * GRAV * clamp(c.rise, 30, 140));
      sp.airT = Math.round(2 * sp.v0 / GRAV);
      sp.total = c.startup + sp.airT + c.recovery;
      sp.interval = 5;
    },
    step: function (m, f, o, sp) {
      var c = sp.mv;
      if (sp.t === c.startup) {
        f.air = true; f.vy = -sp.v0; f.vx = f.dir * 1.7;
        sfxAt(m, c.sfx, f.x);
      }
      if (sp.landed && sp.t - sp.landT >= c.recovery) toNeutral(m, f, o);
    },
    land: function (m, f, sp) {
      sp.landed = true; sp.landT = sp.t; f.air = false; f.vx = 0;
      sfxAt(m, 'land', f.x, 0.6); spawnDust(m, f.x, 4, false);
    },
    hitbox: function (m, f, sp) {
      var a = sp.t - sp.mv.startup;
      if (a < 0 || a > 16 || sp.landed || !canMultiHit(sp, sp.interval)) return null;
      return { box: lbox(f, -4, -f.h * 1.15, 38, -f.h * 0.25),
        d: spDesc(f, sp, { knockdown: true, vy: -7, kb: 1.4, push: 0, juggleFree: true }) };
    },
    invuln: function (sp) { return sp.t < sp.mv.startup + 8; },
    fx: function (m, f, sp) {
      var a = sp.t - sp.mv.startup;
      if (a < 0 || sp.landed) return null;
      return { age: a, life: sp.airT, phase: 'active' };
    },
    p: function (sp) {
      var c = sp.mv;
      if (!sp.landed) return clamp(sp.t / (c.startup + sp.airT), 0, 1) * 0.85;
      return 0.85 + 0.15 * clamp((sp.t - sp.landT) / c.recovery, 0, 1);
    }
  };

  // ---- counter: stance; a melee hit during the window is ignored and answered with a strike ----
  TYPES.counter = {
    start: function (m, f, o, sp) { var c = sp.mv; sp.total = c.startup + c.window + c.recovery; },
    step: function (m, f, o, sp) {
      if (sp.triggered) { if (sp.t - sp.trigT >= 26) toNeutral(m, f, o); }
      else if (sp.t >= sp.total) toNeutral(m, f, o);
    },
    fx: function (m, f, sp) {
      var c = sp.mv;
      if (sp.triggered) return { age: sp.t - sp.trigT, life: 26, phase: 'hit' };
      if (sp.t >= c.startup && sp.t < c.startup + c.window) return { age: sp.t - c.startup, life: c.window, phase: 'charge' };
      return null;
    },
    p: function (sp) {
      var c = sp.mv;
      if (sp.triggered) return 0.5 + 0.5 * clamp((sp.t - sp.trigT) / 26, 0, 1);
      if (sp.t < c.startup + c.window) return 0.4 * clamp(sp.t / (c.startup + 6), 0, 1);
      return 0.4 - 0.4 * clamp((sp.t - c.startup - c.window) / c.recovery, 0, 1);
    }
  };
  function counterActive(f) {
    var sp = f.sp;
    return f.state === 'special' && sp && sp.type === 'counter' && !sp.triggered &&
      sp.t >= sp.mv.startup && sp.t < sp.mv.startup + sp.mv.window;
  }
  function triggerCounter(m, f, att) {
    var sp = f.sp;
    sp.triggered = true; sp.trigT = sp.t; sp.total = sp.t + 26;
    sfxAt(m, 'counter', f.x);
    addPop(m, 'COUNTER!', f.x, -f.h - 14, '#ff5050');
    face(f, att);
    applyHit(m, f, att, spDesc(f, sp, { dmg: sp.mv.damage, level: 'unblockable', force: true, knockdown: true,
      kb: 3, vy: -5, melee: false, hitstop: 16, sx: (f.x + att.x) / 2, sy: -f.h * 0.6 }));
    m.excite = Math.min(1, m.excite + 0.2);
  }

  // ---- teleport: vanish, reappear behind the opponent, strike ----
  TYPES.teleport = {
    start: function (m, f, o, sp) { var c = sp.mv; sp.total = c.startup + 12 + c.recovery; sp.interval = 3; },
    step: function (m, f, o, sp) {
      var c = sp.mv;
      if (sp.t === 2) { spawnFx(m, f, c.fx, f.x, f.y, f.dir, 26, 'active'); sfxAt(m, c.sfx, f.x); }
      sp.vanished = sp.t >= 4 && sp.t < c.startup;
      f.alpha = sp.t < 4 ? 1 - sp.t / 4 : sp.vanished ? 0 : clamp((sp.t - c.startup) / 3, 0, 1);
      if (sp.t === c.startup) {
        var lim = limits(m), side = sign(o.x - f.x), ax = o.x + side * 44;
        if (ax < lim.l || ax > lim.r) ax = o.x - side * 44;
        f.x = clamp(ax, lim.l, lim.r); f.y = 0; f.air = false;
        face(f, o);
        spawnFx(m, f, c.fx, f.x, 0, f.dir, 24, 'active');
        sfxAt(m, 'teleport', f.x, 0.7);
      }
      if (sp.t === c.startup + 4) sfxAt(m, 'swish_heavy', f.x);
      if (sp.t >= sp.total) toNeutral(m, f, o);
    },
    hitbox: function (m, f, sp) {
      var a = sp.t - sp.mv.startup;
      if (a < 4 || a > 10 || !canMultiHit(sp, sp.interval)) return null;
      return { box: lbox(f, 2, -f.h * 0.9, 50, -f.h * 0.2),
        d: spDesc(f, sp, { knockdown: sp.hitsDone >= sp.mv.hits - 1, kb: 2.4, hitstun: 24 }) };
    },
    invuln: function (sp) { return !!sp.vanished; }
  };

  // ---- grab: short-range unblockable command throw that slams the opponent ----
  TYPES.grab = {
    start: function (m, f, o, sp) { var c = sp.mv; sp.total = c.startup + 6 + c.recovery; sp.ct = 0; },
    step: function (m, f, o, sp) {
      var c = sp.mv;
      if (!sp.connected) {
        if (sp.t === c.startup) sfxAt(m, 'swish_heavy', f.x, 0.7);
        if (sp.t >= c.startup && sp.t < c.startup + 6 && m.phase === 'fight' && grabbable(f, o, c.distance)) {
          sp.connected = true; sp.ct = 0;
          grabVictim(m, f, o);

          sfxAt(m, c.sfx, f.x);

        return;

      sp.ct++;
      if (f.victim === o && o.state === 'held') {
        var lift = sp.ct < 30 ? Math.sin(clamp(sp.ct / 22, 0, 1) * Math.PI / 2) * 30 : 0;
        o.x = f.x + f.dir * ((f.w + o.w) / 2 + 2);
        if (o.x < WALL || o.x > STW - WALL) { o.x = clamp(o.x, WALL, STW - WALL); f.x = o.x - f.dir * ((f.w + o.w) / 2 + 2); }
        o.y = -lift;
        if (sp.ct === 30) {
          o.y = 0; o.heldBy = null; f.victim = null;
          forceState(o, 'air'); o.air = true;
          applyHit(m, f, o, spDesc(f, sp, { dmg: sp.mv.damage, level: 'unblockable', force: true, knockdown: true,
            vy: -3, kb: 1.4, melee: false, sx: o.x, sy: -o.h * 0.3, sfx: 'hit_heavy', hitstop: 12 }));
          addShake(m, 8); spawnDust(m, o.x, 10, true); sfxAt(m, 'slam', o.x);
        }
      }

    },
    fx: function (m, f, sp) {
      if (sp.connected && sp.ct <= 36) return { age: sp.ct, life: 36, phase: 'active' };
      var a = sp.t - sp.mv.startup;
      if (!sp.connected && a >= 0 && a < 6) return { age: a, life: 6, phase: 'active' };
      return null;
    },
    invuln: function (sp) { return !!sp.connected; },
    p: function (sp) {
      if (sp.connected) return 0.3 + 0.7 * clamp(sp.ct / 46, 0, 1);
      return clamp(sp.t / sp.total, 0, 1) * 0.3 + (sp.t > sp.mv.startup + 6 ? 0.2 : 0);
    }
  };

    var dx = o.x - f.x;
    return Math.abs(dx) <= range + o.w / 2 && (sign(dx) === f.dir || Math.abs(dx) < 10);
  }

  // ---- slam: jump and pound the floor; a shockwave travels along the ground ----
  TYPES.slam = {
    start: function (m, f, o, sp) {
      sp.v0 = 6.4; sp.airT = Math.round(2 * sp.v0 / GRAV);
      sp.total = sp.mv.startup + sp.airT + sp.mv.recovery;
    },
    step: function (m, f, o, sp) {
      if (sp.t === sp.mv.startup) { f.air = true; f.vy = -sp.v0; f.vx = f.dir * 0.6; sfxAt(m, 'jump', f.x); }
      if (sp.landed && sp.t - sp.landT >= sp.mv.recovery) toNeutral(m, f, o);
    },
    land: function (m, f, sp) {
      var c = sp.mv;
      sp.landed = true; sp.landT = sp.t; f.air = false; f.vx = 0;
      m.ents.push({ kind: 'wave', owner: f, sp: sp, mv: c, x: f.x + f.dir * 16, y: 0, dir: f.dir,
        speed: c.speed, left: c.distance, age: 0, life: Math.round(c.distance / c.speed), phase: 'travel',
        hitsDone: 0, dead: false, id: ++m.seq });

    },
    p: function (sp) {
      if (!sp.landed) return 0.6 * clamp(sp.t / (sp.mv.startup + sp.airT), 0, 1);
      return 0.6 + 0.4 * clamp((sp.t - sp.landT) / sp.mv.recovery, 0, 1);
    }
  };

  // ---- beam: horizontal multi-hit beam from the hand ----
  TYPES.beam = {

  // =====================================================================================================

  // =====================================================================================================

    m.hitstop = Math.max(m.hitstop, d.hitstop || HITSTOP[kind] || 7);
    if (kind !== 'light') addShake(m, kind === 'heavy' ? 2 : 3);
    addScore(m, att, (HIT_SCORE[kind] || 100) + (att.combo - 1) * 100);
    if (att.combo >= 2) { att.comboShowN = att.combo; att.comboShowT = 90; }

    if (m.firstHit === null && m.phase === 'fight') {

  // Pushboxes: keep fighters from overlapping; jumping over is allowed.
  function resolvePush(m, a, b) {

  // =====================================================================================================
  // 8. EFFECTS: sparks, ink splashes, dust, debris, shake, popups  (VISUAL ONLY — never touches gameplay)

          if (R() < 0.7) r.pK = r.K = true; else r.pP = r.P = true;
        }
      }
      return finishRel(r, f.dir);
    }
    // execute a queued plan
    if (ai.plan.length) {
      var step = ai.plan[0];
      if (step.age === undefined) step.age = 0;
      if (step.f) r.f = true;
      if (step.b) r.b = true;
      if (step.u) r.u = true;
      if (step.d) r.d = true;
      if (step.btn) { r[step.btn] = true; if (step.age === 0) r['p' + step.btn] = true; }
      if (++step.age >= (step.n || 1)) ai.plan.shift();
      return finishRel(r, f.dir);
    }
    if (!NEUTRAL[f.state]) return finishRel(r, f.dir);

    // ---------------- reactive layer (uses delayed perception) ----------------
    // incoming projectile / shockwave / rain
    var th = entThreat(m, f, o, ai.react);
    if (th && !ai.seen['e' + th.id]) {
      ai.seen['e' + th.id] = 1;
      var roll = R();
      if (th.jumpOnly) {
        if (roll < 0.25 + ai.L * 0.09) {
          var wait = Math.max(0, Math.floor((th.dist - 60) / th.speed));
          ai.plan = [{ n: wait }, { u: 1, f: d < 160 ? 1 : 0, n: 3 }];
          ai.cool = wait + 30;
          return finishRel(r, f.dir);
        }
      } else if (th.rain) {
        if (roll < ai.blockP) { ai.hold = 50; ai.holdLow = false; }
      } else if (th.dist < 230) {
        if (hasType(f, 'projectile') && !ownProjectile(m, f) && th.dist > 100 && roll < 0.12 + 0.03 * ai.L) {
          planSpecial(ai, ai.byType.projectile); return finishRel(r, f.dir);
        } else if (roll < ai.blockP) {
          ai.hold = Math.min(70, Math.ceil(th.dist / th.speed) + 10); ai.holdLow = R() < 0.5;
        } else if (roll < ai.blockP + 0.1 + ai.L * 0.02 && th.dist > 70) {
          var w2 = Math.max(0, Math.floor((th.dist - 75) / th.speed));
          ai.plan = [{ n: w2 }, { u: 1, f: 1, n: 3 }];
          ai.cool = w2 + 30;
          return finishRel(r, f.dir);
        }
      }
    }
    // opponent attack seen
    if (s.atk && !ai.seen['a' + s.atk]) {
      ai.seen['a' + s.atk] = 1;
      var farType = s.spType === 'beam' || s.spType === 'screen' || s.spType === 'rain' || s.spType === 'teleport' || s.spType === 'rush';
      if ((d < 150 || farType) && s.spType !== 'grab' && R() < ai.blockP) {
        ai.hold = 12 + (R() * 10 | 0) + (s.spType ? 22 : 0);
        ai.holdLow = s.low ? true : s.over ? false : R() < 0.55;
        ai.aaArm = 0;
      }
    }
    // jump seen: arm an anti-air
    if (s.jump && !ai.seen['j' + s.jump]) {
      ai.seen['j' + s.jump] = 1;
      if (R() < ai.aaP) ai.aaArm = s.jump;
    }
    if (ai.aaArm) {
      if (s.jump === ai.aaArm && s.air) {
        var toward = (s.vx * sign(f.x - s.x) > 0.2) || d < 50;
        if (toward && d < 92 && s.y < -14) {
          ai.aaArm = 0; ai.hold = 0;
          if (hasType(f, 'rising')) planSpecial(ai, ai.byType.rising);
          else if (d < 62) planNormal(ai, R() < 0.5 ? 'sk' : 'sp');
          else { ai.hold = 20; ai.holdLow = false; }
          return finishRel(r, f.dir);
        }
      } else if (!s.air) ai.aaArm = 0;
    }
    // hold guard
    if (ai.hold > 0) {
      ai.hold--;
      r.b = true; r.d = ai.holdLow;
      if (s.atk && s.low && !ai.holdLow && R() < ai.blockP * 0.3) ai.holdLow = true;
      else if (s.atk && s.over && ai.holdLow && R() < ai.blockP * 0.3) ai.holdLow = false;
      return finishRel(r, f.dir);
    }
    // punish a whiffed move
    if (s.recov && !ai.seen['r' + s.recov]) {
      ai.seen['r' + s.recov] = 1;
      if (d < 120 && R() < ai.punishP) {
        if (superUsable(f, o, s, d) && R() < 0.4) { planSpecial(ai, 'super'); return finishRel(r, f.dir); }
        if (d < 55) { planNormal(ai, R() < 0.6 ? 'cp' : 'ck'); return finishRel(r, f.dir); }
        if (hasType(f, 'rush') && d < f.specials[ai.byType.rush].distance + 20) { planSpecial(ai, ai.byType.rush); return finishRel(r, f.dir); }
        if (d < 72) { planNormal(ai, 'ck'); return finishRel(r, f.dir); }
      }
    }
    // follow-up after a successful jump-in
    if (ai.followUp) {
      ai.followUp = false;
      if (d < 60 && R() < 0.35 + ai.comboP) { planNormal(ai, 'cp'); return finishRel(r, f.dir); }
    }

    // ---------------- deliberate layer (footsies, zoning, pressure) ----------------
    if (--ai.cool > 0) {
      if (ai.walk > 0) r.f = true; else if (ai.walk < 0) r.b = true;
      if (ai.crouch) r.d = true;
      return finishRel(r, f.dir);
    }
    ai.cool = ai.thinkMin + (R() * ai.thinkVar | 0);
    ai.walk = 0; ai.crouch = false;
    for (var k in ai.recent) ai.recent[k] *= 0.85;
    aiChoose(m, f, o, ai, s, d);
    return finishRel(r, f.dir);
  }

  function aiChoose(m, f, o, ai, s, d) {
    var opts = [], L = ai.L;
    function add(key, w, fn) { if (w > 0) opts.push({ key: key, w: w / (1 + (ai.recent[key] || 0) * 0.9), fn: fn }); }
    function spc(type) { return function () { planSpecial(ai, ai.byType[type]); }; }
    function walk(dir, n) { return function () { ai.walk = dir; ai.cool = n; }; }
    var lim = limits(m);
    var behind = f.dir > 0 ? f.x - lim.l : lim.r - f.x;
    var cornered = behind < 40;
    var oppCornered = (f.dir > 0 ? lim.r - s.x : s.x - lim.l) < 50;
    var lowHp = f.hp < f.maxHp * 0.3;
    var hasProj = hasType(f, 'projectile'), projFree = hasProj && !ownProjectile(m, f) && ai.projCD <= 0;

    if (s.dizzy && d < 140) {
      // free combo on a dizzy opponent
      if (superUsable(f, o, s, d)) add('super', 3, function () { planSpecial(ai, 'super'); });
      if (d > 50) add('fwd', 3, walk(1, 10));
      else { add('sk', 1.5, function () { planNormal(ai, 'sk'); }); add('cp', 2, function () { planNormal(ai, 'cp'); }); }
    } else {
      if (superUsable(f, o, s, d)) add('super', 0.25 + L * 0.12 + (lowHp ? 0.4 : 0), function () { planSpecial(ai, 'super'); });
      if (d < 52) {
        if (!s.air && !s.down) add('throw', 0.5 + L * 0.08, function () { ai.plan = [{ f: 1, n: 1 }, { f: 1, btn: 'P', n: 2 }]; ai.cool = 20; });
        add('cp', 0.8, function () { planNormal(ai, 'cp'); });
        add('sp', 0.4, function () { planNormal(ai, 'sp'); });
        add('ck', 0.5, function () { planNormal(ai, 'ck'); });
        if (hasType(f, 'grab') && !s.air) add('grab', 0.6, spc('grab'));
        if (hasType(f, 'rising')) add('rising', 0.15, spc('rising'));
        if (hasType(f, 'counter')) add('counter', 0.25, spc('counter'));
        if (!cornered) add('back', 0.45, walk(-1, 12 + (R() * 10 | 0)));
        add('jumpback', cornered ? 0 : 0.1, function () { ai.plan = [{ u: 1, b: 1, n: 3 }]; ai.cool = 40; });
        if (cornered) add('jumpout', 0.25, function () { ai.plan = [{ u: 1, f: 1, n: 3 }]; ai.cool = 40; });
        add('guard', 0.25 + L * 0.04, function () { ai.hold = 14 + (R() * 10 | 0); ai.holdLow = true; });
      } else if (d < 95) {
        if (d < 74) add('ck', 0.75, function () { planNormal(ai, 'ck'); });
        if (d < 70) add('sk', 0.65, function () { planNormal(ai, 'sk'); });
        add('fwd', 0.9, walk(1, 8 + (R() * 10 | 0)));
        if (!cornered) add('back', 0.35, walk(-1, 10 + (R() * 12 | 0)));
        add('wait', 0.25, function () { ai.cool = 8 + (R() * 10 | 0); });
        add('guard', 0.15 + L * 0.03, function () { ai.hold = 12 + (R() * 10 | 0); ai.holdLow = R() < 0.6; });
        add('jumpin', 0.12 + L * 0.01, function () { ai.plan = [{ u: 1, f: 1, n: 3 }]; ai.cool = 40; });
        if (hasType(f, 'rush')) add('rush', d < f.specials[ai.byType.rush].distance + 20 ? 0.4 : 0, spc('rush'));
        if (hasType(f, 'slam') && !s.air) add('slam', 0.15, spc('slam'));
        if (hasType(f, 'teleport')) add('teleport', 0.1, spc('teleport'));
        if (hasType(f, 'counter')) add('counter', 0.12, spc('counter'));
        if (hasType(f, 'beam')) add('beam', 0.15, spc('beam'));
        if (hasType(f, 'screen')) add('screen', 0.1, spc('screen'));
        if (hasType(f, 'rain')) add('rain', 0.1, spc('rain'));
        if (projFree && d > 80) add('proj', 0.2, function () { planSpecial(ai, ai.byType.projectile); ai.projCD = 40; });
      } else if (d < 200) {
        add('fwd', 1.3 + (oppCornered ? 0.5 : 0), walk(1, 10 + (R() * 16 | 0)));
        if (!cornered) add('back', 0.3, walk(-1, 10 + (R() * 12 | 0)));
        add('wait', 0.25, function () { ai.cool = 8 + (R() * 12 | 0); });
        add('jumpin', d < 170 ? 0.16 + L * 0.01 : 0.05, function () { ai.plan = [{ u: 1, f: 1, n: 3 }]; ai.cool = 45; });
        if (projFree) add('proj', 0.5 + L * 0.05, function () { planSpecial(ai, ai.byType.projectile); ai.projCD = 45 + (R() * 50 | 0); });
        if (hasType(f, 'rush')) add('rush', d < f.specials[ai.byType.rush].distance + 30 ? 0.3 : 0, spc('rush'));
        if (hasType(f, 'slam') && !s.air) add('slam', 0.22, spc('slam'));
        if (hasType(f, 'teleport')) add('teleport', 0.18, spc('teleport'));
        if (hasType(f, 'beam')) add('beam', 0.22, spc('beam'));
        if (hasType(f, 'rain')) add('rain', 0.18, spc('rain'));
        if (hasType(f, 'screen')) add('screen', 0.12, spc('screen'));
      } else {
        add('fwd', 1.4, walk(1, 14 + (R() * 20 | 0)));
        add('jumpfwd', 0.12, function () { ai.plan = [{ u: 1, f: 1, n: 3 }]; ai.cool = 45; });
        if (projFree) add('proj', 0.8 + L * 0.05, function () { planSpecial(ai, ai.byType.projectile); ai.projCD = 50 + (R() * 50 | 0); });
        if (hasType(f, 'teleport')) add('teleport', 0.25, spc('teleport'));
        if (hasType(f, 'slam') && d < 300 && !s.air) add('slam', 0.15, spc('slam'));
        if (hasType(f, 'rain')) add('rain', 0.22, spc('rain'));
        if (hasType(f, 'beam')) add('beam', 0.18, spc('beam'));
        if (hasType(f, 'screen')) add('screen', 0.12, spc('screen'));
      }
    }
    if (!opts.length) return;
    var pick;
    if (R() < ai.mistake) {
      // a "human" mistake: something random, possibly silly
      var silly = R() < 0.5;
      if (silly) {
        var acts = [function () { ai.plan = [{ u: 1, n: 3 }]; ai.cool = 40; }, function () { planNormal(ai, 'sk'); },
          function () { planSpecial(ai, R() * 3 | 0); }, walk(-1, 20), function () { ai.cool = 25; }];
        acts[R() * acts.length | 0]();
        return;
      }
      pick = opts[R() * opts.length | 0];
    } else {
      var tot = 0, i;
      for (i = 0; i < opts.length; i++) tot += opts[i].w;
      var x = R() * tot;
      for (i = 0; i < opts.length; i++) { x -= opts[i].w; if (x <= 0) { pick = opts[i]; break; } }
      pick = pick || opts[opts.length - 1];
    }
    ai.recent[pick.key] = (ai.recent[pick.key] || 0) + 1;
    pick.fn();
  }

  // =====================================================================================================
  // 10. ROUND / MATCH FLOW
  // =====================================================================================================
  var ANN_STYLE = {
    round: { grad: ['#fff8c0', '#ffa020'], scale: 4 },
    final: { grad: ['#ffffff', '#ff4040'], scale: 4 },
    fight: { grad: ['#ffffff', '#ff3020'], scale: 5 },
    ko: { grad: ['#ffffff', '#ff2020'], scale: 6 },
    time: { grad: ['#ffffff', '#40c0ff'], scale: 5 },
    perfect: { grad: ['#ffffff', '#30d0ff'], scale: 4 },
    win: { grad: ['#fff8c0', '#ffb020'], scale: 4 },
    lose: { grad: ['#e0e0ff', '#6060c0'], scale: 4 }
  };
  function announce(m, text, style, len, y) {
    var st = ANN_STYLE[style] || ANN_STYLE.round;
    m.ann = { text: text, t: 0, len: len || 70, scale: st.scale, grad: st.grad, y: y || 86, style: style };
  }

  function resetRound(m) {
    var A = m.F[0], B = m.F[1], intro = m.round === 1;
    resetFighter(A, STW / 2 - 70, 1, intro);
    resetFighter(B, STW / 2 + 70, -1, intro);
    m.cam = CAM_MAX / 2;
    m.ents.length = 0; m.parts.length = 0; m.pops.length = 0;
    m.timer = m.roundTime > 0 ? m.roundTime * 60 + 59 : 0;
    m.phase = 'pre'; m.pt = 0; m.control = false; m.hitstop = 0; m.slowmo = 0; m.superFlash = null;
    m.flash = 0; m.shake = 0; m.roundWinner = null; m.tally = null; m.firstHit = null; m.ann = null;
    m.snaps[0].length = 0; m.snaps[1].length = 0;
    m.fade = m.round === 1 ? 1 : 1;
    m.vfx = makeVfx();  // visual-only state
  }

  function isFinalRound(m) {
    return m.F[0].wins === m.rtw - 1 && m.F[1].wins === m.rtw - 1 && m.round > 1;
  }

  function phaseUpdate(m) {
    var A = m.F[0], B = m.F[1];
    m.pt++;
    switch (m.phase) {
      case 'pre': {
        var introLen = m.round === 1 ? 100 : 30;
        if (m.pt === 6 && m.round === 1 && m.opts.finalFight) { announce(m, 'FINAL FIGHT', 'final', 80); say('Final fight!', 'announcer', true); }
        if (m.pt === introLen) {
          if (A.state === 'intro') forceState(A, 'idle');
          if (B.state === 'intro') forceState(B, 'idle');
          if (isFinalRound(m)) { announce(m, 'FINAL ROUND', 'final', 72); say('Final round', 'announcer', true); }
          else { announce(m, 'ROUND ' + m.round, 'round', 72); say('Round ' + (NUMWORD[m.round] || m.round), 'announcer', true); }
        }
        if (m.pt === introLen + 78) {
          announce(m, 'FIGHT!', 'fight', 46);
          say('Fight!', 'announcer', true);
          sfx('crowd_cheer', { vol: 0.5 });
          m.phase = 'fight'; m.pt = 0; m.control = true;
        }
        break;
      }
      case 'fight':
        if (m.roundTime > 0 && m.timer > 0) {
          m.timer--;
          var secs = Math.floor(m.timer / 60);
          if (m.timer % 60 === 59 && secs < 10 && secs > 0) sfx('timer_tick');
          if (m.timer <= 59) timeOver(m);
        }
        break;
      case 'ko': {
        var w = m.roundWinner;
        if (w >= 0) {
          var wf = m.F[w];
          if (m.pt >= 100 && wf.state !== 'victory' && (NEUTRAL[wf.state] || wf.state === 'land')) { forceState(wf, 'victory'); wf.crouching = false; }
        }
        if (m.pt === 150 && w >= 0 && !m.F[w].lostHealth) {
          m.perfectRound = true;
          announce(m, 'PERFECT', 'perfect', 80);
          say('Perfect!', 'announcer', true);
          sfx('crowd_cheer');
        }
        var ready = w < 0 || m.F[w].state === 'victory' || m.pt > 420;
        if (m.pt >= (m.perfectRound ? 230 : 160) && ready) startTally(m);
        break;
      }
      case 'timeover': {
        var tw = m.roundWinner;
        if (m.pt >= 50) {
          for (var i = 0; i < 2; i++) {
            var f = m.F[i];
            if ((NEUTRAL[f.state] || f.state === 'land') || m.pt > 200) {
              if (f.state === 'victory' || f.state === 'lose') continue;
              if (!(NEUTRAL[f.state] || f.state === 'land') && f.state !== 'block' && f.state !== 'hit' && f.state !== 'dizzy') continue;
              forceState(f, tw === i ? 'victory' : 'lose');
              f.vx = 0; f.crouching = false; f.air = false; f.y = 0;
            }
          }
        }
        if (m.pt === 70 && tw < 0) announce(m, 'DRAW GAME', 'time', 80);
        if (m.pt >= 160 && (A.state === 'victory' || A.state === 'lose') && (B.state === 'victory' || B.state === 'lose')) startTally(m);
        else if (m.pt > 400) startTally(m);
        break;
      }
      case 'tally': tallyUpdate(m); break;
      case 'fadeout':
        m.fade = clamp(m.pt / 30, 0, 1);
        if (m.pt >= 34) { m.round++; resetRound(m); }
        break;
      case 'outro':
        if (m.pt === 30) {
          var res = m.result, txt0, st = 'win', line;
          var humans = [!m.cpu[0], !m.cpu[1]];
          if (humans[0] !== humans[1]) {
            var hs = humans[0] ? 0 : 1;
            if (res.winner === hs) { txt0 = 'YOU WIN'; line = 'You win!'; } else { txt0 = 'YOU LOSE'; line = 'You lose!'; st = 'lose'; }
            jingle(res.winner === hs ? 'win' : 'lose');
          } else {
            txt0 = 'PLAYER ' + (res.winner + 1) + ' WINS';
            line = 'Player ' + NUMWORD[res.winner + 1] + ' wins!';
            jingle('win');
          }
          announce(m, txt0, st, 200, 80);
          m.ann.sub = m.F[res.winner].name;
          say(line, 'announcer', true);
        }
        if (m.pt >= 250) m.done = true;
        break;
    }
    if (m.phase === 'pre' && m.round > 1) m.fade = clamp(1 - m.pt / 20, 0, 1);
    else if (m.phase === 'pre' && m.round === 1) m.fade = clamp(1 - m.pt / 24, 0, 1);
  }

  function startKO(m) {
    var A = m.F[0], B = m.F[1];
    var d0 = A.hp <= 0, d1 = B.hp <= 0;
    m.phase = 'ko'; m.pt = 0; m.control = false; m.perfectRound = false;
    m.roundWinner = d0 && d1 ? -1 : d0 ? 1 : 0;
    if (m.roundWinner >= 0) m.F[m.roundWinner].wins++;
    m.slowmo = 80; m.flash = 1;
    m.hitstop = Math.max(m.hitstop, 18);
    addShake(m, 10);
    var dbl = m.roundWinner < 0;
    announce(m, dbl ? 'DOUBLE K.O.' : 'K.O.', 'ko', 110);
    sfx('ko'); sfx('crowd_cheer');
    say(dbl ? 'Double K.O.' : 'K.O.!', 'announcer', true);
    m.excite = 1;
    m.timeLeft = Math.floor(m.timer / 60);
    vfxKO(m);           // visual-only KO burst
  }

  function timeOver(m) {
    var A = m.F[0], B = m.F[1];
    m.phase = 'timeover'; m.pt = 0; m.control = false; m.perfectRound = false; m.timer = 0;
    var r0 = A.hp / A.maxHp, r1 = B.hp / B.maxHp;
    m.roundWinner = Math.abs(r0 - r1) < 0.0005 ? -1 : r0 > r1 ? 0 : 1;
    if (m.roundWinner >= 0) m.F[m.roundWinner].wins++;
    announce(m, 'TIME', 'time', 80);
    say('Time!', 'announcer', true);
    sfx('bell');
    m.timeLeft = 0;
  }

  function startTally(m) {
    m.phase = 'tally'; m.pt = 0;
    var w = m.roundWinner;
    m.rounds.push({ winner: w, perfect: !!m.perfectRound, timeLeft: m.timeLeft });
    var items = [];
    if (w >= 0) {
      var f = m.F[w];
      items.push({ label: 'TIME BONUS', val: m.timeLeft * 100 });
      items.push({ label: 'VITALITY BONUS', val: Math.round(f.hp) * 10 });
      if (m.perfectRound) items.push({ label: 'PERFECT BONUS', val: 30000 });
    }
    m.tally = { w: w, items: items, idx: 0, shown: 0, t: 0 };
  }
  function tallyUpdate(m) {
    var tl = m.tally;
    tl.t++;
    if (tl.w >= 0 && tl.idx < tl.items.length) {
      var it = tl.items[tl.idx];
      if (tl.t > 16) {
        var stepv = Math.max(10, Math.ceil(it.val / 30));
        var add = Math.min(stepv, it.val - tl.shown);
        tl.shown += add; m.F[tl.w].score += add;
        if (tl.t % 4 === 0 && add > 0) sfx('coin', { vol: 0.35 });
        if (tl.shown >= it.val) { it.done = true; tl.idx++; tl.shown = 0; tl.t = 0; }
      }
      return;
    }
    if (tl.t < 50) return;
    // round over: match end or next round
    var A = m.F[0], B = m.F[1];
    var over = A.wins >= m.rtw || B.wins >= m.rtw || m.round >= m.maxRounds;
    if (over) startOutro(m);
    else { m.phase = 'fadeout'; m.pt = 0; }
  }

  function startOutro(m) {
    var A = m.F[0], B = m.F[1], w;
    if (A.wins !== B.wins) w = A.wins > B.wins ? 0 : 1;
    else w = A.hp / A.maxHp >= B.hp / B.maxHp ? 0 : 1;
    m.phase = 'outro'; m.pt = 0;
    var loser = m.F[1 - w];
    m.result = { winner: w, rounds: [A.wins, B.wins], perfect: !m.F[w].lostMatchHealth,
      score: [A.score, B.score], timeLeft: m.timeLeft || 0 };
    if (m.F[w].state !== 'victory') { forceState(m.F[w], 'victory'); m.F[w].y = 0; m.F[w].air = false; }
    if (loser.state !== 'ko' && loser.state !== 'down') forceState(loser, 'lose');
  }

  // =====================================================================================================
  // One simulation tick
  // =====================================================================================================
  function update(m, inputs) {
    if (m.done) return;
    var A = m.F[0], B = m.F[1], i, f, o;
    m.frame++;
    m.clock += 1 / 60;
    // inputs (recorded every tick so motions can be buffered during hitstop / super freeze)
    for (i = 0; i < 2; i++) {
      f = m.F[i]; o = m.F[1 - i];
      var inp = f.cpu ? aiInput(m, f, o) : fromRaw(inputs && inputs[i], f.dir);
